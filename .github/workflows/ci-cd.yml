# CI/CD de api-be-project-manager-v1 (solo GitHub Actions).
# - Pull Request a master: build, pruebas contra MySQL y build de la imagen sin publicarla.
# - Push a master: lo anterior y publicación de la imagen en GHCR (latest + sha).
# - Tag vX.Y.Z: publicación con las etiquetas de versión.
name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Base de datos solo para las pruebas (p. ej. el contextLoads de @SpringBootTest).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: project_manager
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/project_manager
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop   # solo en CI: esquema efímero

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Repos creados en Windows suelen perder el permiso de ejecución de mvnw.
      - name: Permiso de ejecución de mvnw
        run: chmod +x mvnw

      - name: Compilar y verificar
        run: ./mvnw -B -ntp clean verify

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  image:
    name: Imagen Docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El nombre de la imagen se normaliza a minúsculas (ghcr.io/<owner>/<repo>).
      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build y publicación
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
